<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Cloud MVP</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <div id="canvas-host" aria-label="Interactive 3D cloud canvas"></div>

      <section class="toolbar" aria-label="Cloud controls">
        <input id="text-input" type="text" value="CLOUD" maxlength="18" aria-label="Cloud text" />
        <button id="clear-button" type="button">Clear</button>
        <button id="random-button" type="button">Seed</button>
      </section>

      <aside class="settings" aria-label="Settings">
        <label>
          <span>Density</span>
          <input id="density" type="range" min="0.45" max="2.4" step="0.05" value="1.75" />
        </label>
        <label>
          <span>Puff size</span>
          <input id="puff-size" type="range" min="0.35" max="2.2" step="0.05" value="0.78" />
        </label>
        <label>
          <span>Cloud scale</span>
          <input id="cloud-scale" type="range" min="0.55" max="1.75" step="0.05" value="1.18" />
        </label>
        <label>
          <span>Depth</span>
          <input id="depth" type="range" min="0.3" max="2.8" step="0.05" value="1.05" />
        </label>
        <label>
          <span>Contrast</span>
          <input id="contrast" type="range" min="0.6" max="1.9" step="0.05" value="1.25" />
        </label>
        <label>
          <span>Softness</span>
          <input id="softness" type="range" min="0.04" max="0.5" step="0.01" value="0.12" />
        </label>
        <label>
          <span>Hover cut</span>
          <input id="dissolve" type="range" min="0.15" max="1.3" step="0.01" value="0.72" />
        </label>
        <label>
          <span>Sun</span>
          <input id="sun" type="range" min="-0.7" max="1" step="0.01" value="0.42" />
        </label>
      </aside>

      <p class="status" id="status">Type to reshape. Move cursor through the cloud.</p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
